<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ระบบทะเบียนบุคลากรกีฬา (Executive Dashboard)</title>
  
  <!-- โหลด Tailwind CSS ผ่าน CDN (Executive Shortcut) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- โหลด SheetJS สำหรับอ่านไฟล์ Excel หน้าบ้าน -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased selection:bg-blue-200">

  <!-- 🔵 Navbar -->
  <nav class="bg-blue-900 shadow-md border-b-4 border-blue-700">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <div class="flex-shrink-0 flex items-center gap-3">
          <div class="bg-white text-blue-900 p-1.5 rounded-lg">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
          </div>
          <h1 class="text-white text-lg font-bold tracking-wide">ระบบทะเบียนบุคลากรกีฬา</h1>
        </div>
        <div class="text-blue-200 text-sm hidden sm:block">
          <span class="flex items-center gap-1">
            <span class="relative flex h-3 w-3">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
            </span>
            เชื่อมต่อ API ปกติ
          </span>
        </div>
      </div>
    </div>
  </nav>

  <!-- 🟢 Main Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
    
    <!-- Section 1: Executive Dashboard -->
    <section id="dashboard-section" class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-white rounded-xl shadow-sm p-5 border-l-4 border-blue-600 transition hover:shadow-md">
        <h2 class="text-sm font-semibold text-gray-500">บุคลากรในระบบ (ตามเงื่อนไข)</h2>
        <div class="flex items-baseline mt-2 gap-2">
          <p class="text-3xl font-bold text-blue-900" id="stat-total">--</p>
          <span class="text-sm text-gray-400">คน</span>
        </div>
      </div>
      <div class="bg-white rounded-xl shadow-sm p-5 border-l-4 border-green-500 transition hover:shadow-md">
        <h2 class="text-sm font-semibold text-gray-500">ผ่านการอบรมปีล่าสุด</h2>
        <div class="flex items-baseline mt-2 gap-2">
          <p class="text-3xl font-bold text-gray-800" id="stat-recent">--</p>
          <span class="text-sm text-gray-400">รายการ</span>
        </div>
      </div>
      <div class="bg-white rounded-xl shadow-sm p-5 border-l-4 border-amber-500 transition hover:shadow-md">
        <h2 class="text-sm font-semibold text-gray-500">หลักสูตรที่มีผู้เรียนสูงสุด</h2>
        <p class="text-xl font-bold text-gray-800 mt-2 truncate" id="stat-top-course">กำลังประมวลผล...</p>
      </div>
    </section>

    <!-- Section 2: Smart Search & Actions -->
    <section class="bg-white rounded-xl shadow-sm p-5 flex flex-col gap-4 border border-gray-100">
      <div class="flex flex-col md:flex-row justify-between items-center gap-4">
        <!-- ช่องค้นหา -->
        <div class="w-full md:w-1/3 relative group">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <svg class="h-5 w-5 text-gray-400 group-focus-within:text-blue-600 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          </div>
          <input type="text" id="searchInput" placeholder="ค้นหาด้วยชื่อ, หน่วยงาน หรือรหัส UID..." 
                 class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:bg-white focus:border-blue-500 outline-none transition-all text-sm">
        </div>
        
        <!-- ตัวกรอง (Smart Filters) -->
        <div class="w-full md:w-auto flex flex-wrap gap-2">
          <select id="filterYear" class="bg-gray-50 border border-gray-200 text-gray-700 text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 p-2.5 outline-none transition-all cursor-pointer">
            <option value="">ทุกปีการศึกษา</option>
            <option value="2569">ปี 2569</option>
            <option value="2568">ปี 2568</option>
          </select>
          <select id="filterCourse" class="bg-gray-50 border border-gray-200 text-gray-700 text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 p-2.5 outline-none transition-all cursor-pointer">
            <option value="">ทุกหลักสูตร</option>
            <option value="TSLP">TSLP</option>
            <option value="ICSC">ICSC</option>
            <option value="ICSM">ICSM</option>
          </select>
        </div>

        <!-- ปุ่มจัดการ -->
        <div class="flex gap-2 w-full md:w-auto">
          <label class="cursor-pointer bg-green-600 hover:bg-green-700 text-white font-medium py-2.5 px-4 rounded-lg shadow-sm transition-all flex items-center justify-center gap-2 text-sm w-full md:w-auto">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
            นำเข้า Excel
            <input type="file" id="excelUpload" accept=".xlsx, .xls" class="hidden" />
          </label>
          <button id="addPersonBtn" class="bg-blue-800 hover:bg-blue-900 text-white font-medium py-2.5 px-4 rounded-lg shadow-sm transition-all flex items-center justify-center gap-2 text-sm w-full md:w-auto">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            เพิ่มบุคคล
          </button>
        </div>
      </div>
    </section>

    <!-- Section 3: Data Table -->
    <section class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-200">
      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-blue-900 text-white">
            <tr>
              <th scope="col" class="px-6 py-4 text-left text-xs font-semibold uppercase tracking-wider w-32">รหัส UID</th>
              <th scope="col" class="px-6 py-4 text-left text-xs font-semibold uppercase tracking-wider">ชื่อ-นามสกุล</th>
              <th scope="col" class="px-6 py-4 text-left text-xs font-semibold uppercase tracking-wider">หน่วยงาน</th>
              <th scope="col" class="px-6 py-4 text-center text-xs font-semibold uppercase tracking-wider w-32">สถานะ</th>
              <th scope="col" class="px-6 py-4 text-right text-xs font-semibold uppercase tracking-wider w-24">จัดการ</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="bg-white divide-y divide-gray-200">
            <!-- Loading State -->
            <tr>
              <td colspan="5" class="px-6 py-12 text-center">
                <div class="flex flex-col items-center justify-center text-blue-600 font-medium">
                  <svg class="animate-spin -ml-1 mr-3 h-8 w-8 text-blue-600 mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                  </svg>
                  กำลังเชื่อมต่อฐานข้อมูล...
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>
  
  <script src="./main.js"></script>
</body>
</html>
