<!-- นำไปวางใน <head> เพื่อเรียกใช้ SheetJS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<!-- แทนที่ Section 2 เดิม ด้วยโค้ดด้านล่างนี้ -->
<section class="bg-white rounded-xl shadow-sm p-5 flex flex-col gap-4 border border-gray-100">
  <div class="flex flex-col md:flex-row justify-between items-center gap-4">
    <!-- Search -->
    <div class="w-full md:w-1/3 relative group">
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
        <svg class="h-5 w-5 text-gray-400 group-focus-within:text-blue-600 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      </div>
      <input type="text" id="searchInput" placeholder="ค้นหาชื่อ หรือรหัส..." class="w-full pl-10 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-lg outline-none text-sm focus:border-blue-500 focus:bg-white">
    </div>
    
    <!-- Smart Filters -->
    <div class="w-full md:w-auto flex flex-wrap gap-2">
      <select id="filterYear" class="bg-gray-50 border border-gray-200 text-gray-700 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2 outline-none">
        <option value="">ทุกปี</option>
        <option value="2569">2569</option>
        <option value="2568">2568</option>
      </select>
      <select id="filterCourse" class="bg-gray-50 border border-gray-200 text-gray-700 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2 outline-none">
        <option value="">ทุกหลักสูตร</option>
        <option value="TSLP">TSLP</option>
        <option value="ICSC">ICSC</option>
      </select>
    </div>

    <!-- Actions -->
    <div class="flex gap-2 w-full md:w-auto">
      <label class="cursor-pointer bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-4 rounded-lg shadow-sm transition-all flex items-center gap-2 text-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
        นำเข้า Excel
        <input type="file" id="excelUpload" accept=".xlsx, .xls" class="hidden" />
      </label>
      <button class="bg-blue-800 hover:bg-blue-900 text-white font-medium py-2 px-4 rounded-lg shadow-sm transition-all flex items-center gap-2 text-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        เพิ่มรายบุคคล
      </button>
    </div>
  </div>
</section>
